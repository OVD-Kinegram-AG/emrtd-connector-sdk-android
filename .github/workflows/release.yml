# When a tag in the format x.y.z is pushed, this workflow publishes the library
# to the Kinegram Maven registry and creates a GitHub release.
name: Release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build:
    permissions:
      contents: write
      discussions: write
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_signingKey : ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingPassword : ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check-out repo
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Set version
        run: echo -e "\nversion=$GITHUB_REF_NAME" >> gradle.properties
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # A published version never changes. Stop if the registry has it already.
      - name: Check that the version is new
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://maven.registry.kinegram.digital/releases/com/kinegram/android/emrtdconnector/$GITHUB_REF_NAME/emrtdconnector-$GITHUB_REF_NAME.pom")
          if [ "$status" != 404 ]; then
            echo "The registry answers $status for version $GITHUB_REF_NAME. Expected 404."
            exit 1
          fi
      - name: Publish to the Kinegram Maven registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MAVEN_PUBLISHER_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MAVEN_PUBLISHER_AWS_SECRET_ACCESS_KEY }}
          # Gradle's S3 transport uses the AWS SDK for Java 1.x. This hides the
          # end-of-support notice of the SDK, which comes with a long stack trace.
          # See https://github.com/gradle/gradle/issues/27774
          AWS_JAVA_V1_DISABLE_DEPRECATION_ANNOUNCEMENT: "true"
        run: |
          # Without credentials, Gradle reports only "Access Denied".
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "The secrets MAVEN_PUBLISHER_AWS_ACCESS_KEY_ID and MAVEN_PUBLISHER_AWS_SECRET_ACCESS_KEY are missing."
            exit 1
          fi
          ./gradlew :kinegram-emrtd-connector:publishReleasePublicationToKinegramRepository
  create-github-release:
    needs: build
    permissions:
      contents: write
      discussions: write
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repo
        uses: actions/checkout@v4
      - name: Extract Changes from CHANGELOG.md
        run: |
          CHANGES=$(awk -v version="## $GITHUB_REF_NAME" '{
             if ($0 ~ "^## " && found) exit;
             if (found) print;
             if ($0 == version) found=1;
          }' CHANGELOG.md)
          if [ -n "$CHANGES" ]; then
            echo -e "### Changes\n$CHANGES" > "CHANGELOG-$GITHUB_REF_NAME.md"
          else
            echo "No changes found for version $GITHUB_REF_NAME."
            echo "No changelog" > "CHANGELOG-$GITHUB_REF_NAME.md"
          fi
      - name: Github Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: "CHANGELOG-${{ github.ref_name }}.md"
          body: ""
